<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f36b21">

    <title>Contact Us | One Impact Social Development Network</title>

    <meta name="description" content="Get in touch with One Impact Social Development Network. Contact us for enquiries, partnerships and opportunities to create positive social change.">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --orange: #f36b21;
            --orange-dark: #d9510d;
            --orange-light: #fff0e5;
            --cream: #fffaf5;
            --white: #ffffff;
            --dark: #242424;
            --text: #66615d;
            --border: #eee8e2;
            --black: #191919;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'DM Sans', sans-serif;
            color: var(--dark);
            line-height: 1.7;
            background: var(--white);
        }

        a {
            text-decoration: none;
        }

        .container {
            width: 90%;
            max-width: 1180px;
            margin: auto;
        }

        /* HEADER */

        header {
            background: var(--white);
            padding: 17px 0;
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: 0 2px 15px rgba(0,0,0,0.05);
        }

        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 25px;
        }

        .brand {
            font-family: 'Manrope', sans-serif;
            font-size: 23px;
            font-weight: 800;
            color: var(--orange);
            line-height: 1.2;
        }

        .brand small {
            display: block;
            color: var(--dark);
            font-size: 9px;
            letter-spacing: 1.6px;
            margin-top: 4px;
        }

        nav {
            display: flex;
            align-items: center;
            gap: 25px;
        }

        nav a {
            color: var(--dark);
            font-size: 13px;
            font-weight: 700;
            transition: 0.3s;
        }

        nav a:hover,
        nav a.active {
            color: var(--orange);
        }

        nav .nav-button {
            background: var(--orange);
            color: var(--white);
            padding: 11px 20px;
            border-radius: 5px;
        }

        nav .nav-button:hover {
            background: var(--orange-dark);
            color: var(--white);
        }

        .menu-toggle {
            display: none;
            background: none;
            border: none;
            font-size: 27px;
            color: var(--dark);
            cursor: pointer;
        }

        /* HERO */

        .hero {
            background:
                linear-gradient(110deg, rgba(35,25,18,0.82), rgba(35,25,18,0.48)),
                linear-gradient(120deg, #f36b21, #ffb078);
            padding: 115px 20px;
            text-align: center;
            color: var(--white);
        }

        .hero-label {
            display: inline-block;
            border: 1px solid rgba(255,255,255,0.65);
            border-radius: 30px;
            padding: 7px 18px;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 2px;
            margin-bottom: 22px;
        }

        .hero h1 {
            font-family: 'Manrope', sans-serif;
            font-size: clamp(36px, 5vw, 56px);
            line-height: 1.2;
            margin-bottom: 20px;
        }

        .hero p {
            max-width: 700px;
            margin: auto;
            color: #fff4ec;
            font-size: 16px;
        }

        /* INTRODUCTION */

        .intro {
            padding: 85px 0 45px;
            text-align: center;
        }

        .section-label {
            color: var(--orange-dark);
            font-size: 12px;
            font-weight: 800;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .intro h2 {
            font-family: 'Manrope', sans-serif;
            font-size: clamp(28px, 4vw, 39px);
            margin: 13px 0;
        }

        .intro p {
            max-width: 720px;
            margin: auto;
            color: var(--text);
            font-size: 15px;
        }

        /* CONTACT CARDS */

        .contact-section {
            padding: 30px 0 90px;
        }

        .contact-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 25px;
        }

        .contact-card {
            padding: 38px 28px;
            border: 1px solid var(--border);
            border-radius: 12px;
            text-align: center;
            background: var(--white);
            transition: 0.3s ease;
        }

        .contact-card:hover {
            transform: translateY(-7px);
            box-shadow: 0 15px 35px rgba(0,0,0,0.07);
            border-color: #ffd0b0;
        }

        .icon {
            width: 68px;
            height: 68px;
            background: var(--orange-light);
            color: var(--orange);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            margin: 0 auto 22px;
        }

        .contact-card h3 {
            font-family: 'Manrope', sans-serif;
            font-size: 20px;
            margin-bottom: 10px;
        }

        .contact-card p {
            color: var(--text);
            font-size: 14px;
            margin-bottom: 17px;
        }

        .contact-card a {
            color: var(--orange-dark);
            font-size: 14px;
            font-weight: 700;
            overflow-wrap: anywhere;
        }

        .contact-card a:hover {
            text-decoration: underline;
        }

        /* CONTACT DETAILS */

        .details-section {
            background: var(--cream);
            padding: 90px 0;
        }

        .details-layout {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 65px;
            align-items: center;
        }

        .details-text h2 {
            font-family: 'Manrope', sans-serif;
            font-size: clamp(29px, 4vw, 41px);
            line-height: 1.3;
            margin: 15px 0;
        }

        .details-text > p {
            color: var(--text);
            font-size: 15px;
            margin-bottom: 28px;
        }

        .detail-point {
            display: flex;
            gap: 15px;
            margin-bottom: 22px;
        }

        .check {
            width: 32px;
            height: 32px;
            flex-shrink: 0;
            background: var(--orange);
            color: var(--white);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
        }

        .detail-point h4 {
            font-family: 'Manrope', sans-serif;
            font-size: 16px;
            margin-bottom: 4px;
        }

        .detail-point p {
            color: var(--text);
            font-size: 14px;
        }

        .details-box {
            background: var(--white);
            padding: 42px;
            border-radius: 14px;
            box-shadow: 0 12px 40px rgba(0,0,0,0.06);
            border-top: 5px solid var(--orange);
        }

        .details-box h3 {
            font-family: 'Manrope', sans-serif;
            font-size: 25px;
            margin-bottom: 10px;
        }

        .details-box > p {
            color: var(--text);
            font-size: 14px;
            margin-bottom: 25px;
        }

        .details-box a {
            display: block;
            padding: 16px 18px;
            background: var(--cream);
            border-radius: 7px;
            margin-bottom: 13px;
            color: var(--dark);
            font-weight: 700;
            font-size: 14px;
            overflow-wrap: anywhere;
            transition: 0.3s;
        }

        .details-box a:hover {
            background: var(--orange-light);
        }

        .details-box a span {
            display: block;
            color: var(--orange-dark);
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 4px;
        }

        .details-box .whatsapp-button {
            text-align: center;
            background: var(--orange);
            color: var(--white);
            padding: 15px 20px;
            margin-top: 17px;
        }

        .details-box .whatsapp-button:hover {
            background: var(--orange-dark);
        }

        /* CTA */

        .cta {
            padding: 85px 20px;
            text-align: center;
            background: var(--orange);
            color: var(--white);
        }

        .cta h2 {
            font-family: 'Manrope', sans-serif;
            font-size: clamp(27px, 4vw, 40px);
            margin-bottom: 15px;
        }

        .cta p {
            max-width: 720px;
            margin: auto;
            color: #fff4ec;
            font-size: 15px;
        }

        .cta a {
            display: inline-block;
            margin-top: 28px;
            background: var(--white);
            color: var(--orange-dark);
            padding: 14px 27px;
            border-radius: 5px;
            font-weight: 800;
            transition: 0.3s;
        }

        .cta a:hover {
            background: var(--orange-light);
            transform: translateY(-3px);
        }

        /* FOOTER */

        footer {
            background: var(--black);
            color: var(--white);
            padding: 65px 0 22px;
        }

        .footer-grid {
            display: grid;
            grid-template-columns: 2fr 1fr 1fr 1fr;
            gap: 40px;
            margin-bottom: 45px;
        }

        .footer-brand {
            color: var(--orange);
            font-family: 'Manrope', sans-serif;
            font-size: 20px;
            font-weight: 800;
            margin-bottom: 15px;
        }

        footer p {
            color: #c7c7c7;
            font-size: 13px;
            line-height: 1.8;
        }

        .footer-column h4 {
            font-family: 'Manrope', sans-serif;
            font-size: 15px;
            margin-bottom: 18px;
        }

        .footer-column a {
            display: block;
            color: #c7c7c7;
            font-size: 13px;
            margin-bottom: 11px;
            transition: 0.3s;
            overflow-wrap: anywhere;
        }

        .footer-column a:hover {
            color: var(--orange);
            padding-left: 3px;
        }

        .copyright {
            border-top: 1px solid #393939;
            text-align: center;
            padding-top: 22px;
            color: #aaa;
            font-size: 12px;
        }

        /* RESPONSIVE DESIGN */

        @media (max-width: 950px) {
            .navbar {
                flex-wrap: wrap;
            }

            .menu-toggle {
                display: block;
            }

            nav {
                display: none;
                width: 100%;
                flex-direction: column;
                align-items: flex-start;
                gap: 0;
                padding-top: 15px;
                border-top: 1px solid var(--border);
            }

            nav.show {
                display: flex;
            }

            nav a {
                width: 100%;
                padding: 11px 5px;
            }

            nav .nav-button {
                width: fit-content;
                margin-top: 8px;
                padding: 10px 18px;
            }

            .footer-grid {
                grid-template-columns: 1.5fr 1fr 1fr;
            }
        }

        @media (max-width: 750px) {
            .contact-grid {
                grid-template-columns: 1fr 1fr;
            }

            .details-layout {
                grid-template-columns: 1fr;
                gap: 40px;
            }

            .footer-grid {
                grid-template-columns: 1fr 1fr;
            }
        }

        @media (max-width: 520px) {
            .hero {
                padding: 80px 15px;
            }

            .intro {
                padding-top: 65px;
            }

            .contact-grid,
            .footer-grid {
                grid-template-columns: 1fr;
            }

            .contact-card {
                padding: 32px 22px;
            }

            .details-section {
                padding: 65
